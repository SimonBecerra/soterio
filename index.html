.tag{font-size:12px;color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:40px}

.meta b{color:var(--ink);font-weight:600}
.first{text-align:center;font:italic 17px "EB Garamond",serif;color:var(--muted);margin:4px 0 14px}

.vn{font:600 22px "EB Garamond",serif;color:var(--gold);min-width:22px;padding-top:2px}
.verse.ref{font-style:italic;padding-left:38px}
h4{font:600 13px Arimo;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.sheet{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}

.g{display:grid;grid-template-columns:110px 1fr;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}.thumbs img{height:80px;border:1px solid var(--line);border-radius:6px;background:#fff}
.thumbs button{position:absolute;top:-6px;right:-6px;border-radius:50%;border:0;width:22px;height:22px;background:var(--accent);color:#fff;cursor:pointer}

@media print{.bar,.row,header,footer{display:none}.view{border:0;box-shadow:none}}

function sheets(imgs,audio,title,crop){return(imgs||[]).map(s=>`<div class="tw${audio?" has":""}${crop?" crop":""}"${audio?` data-au="${akey(audio)}" role="button" aria-label="Tune sheet for ${esc(title)}. Tap to show the play button"`:""}><img class="tune" src="${/^data:/.test(s)?s:"/_blob/"+s}" alt="Tune for ${esc(title)}">${audio?`<div class="tov"><button class="pb" aria-label="Play tune">${PL}</button></div>`:""}</div>`).join("")}

function versions(h){return[{tune:h.tune,meter:h.meter,lyrics:h.lyrics,sheets:h.sheets||[],audio:h.audio||"",highNote:!!h.highNote}].concat((h.alts||[]).map(a=>({tune:a.tune,meter:a.meter||h.meter,lyrics:a.lyrics||h.lyrics,sheets:a.sheets||[],audio:a.audio||"",highNote:!!a.highNote})))}
function cur(h){const v=versions(h),i=ver&&ver.id===h.id?ver.i:0;return v[i]||v[0]}
function altScreen(){const h=HYMNS.find(x=>x.id===state.id);if(!h)return list();const vs=versions(h),ci=ver&&ver.id===h.id?ver.i:0;
return `<div class="row" style="margin:0 0 14px"><button class="btn bk" data-a="open" data-id="${h.id}" aria-label="Back to hymn"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><article class="view"><h2 class="mh">Alternate tunes</h2><p class="ms">Other tunes for “${esc(h.title)}”</p><hr>`+
vs.map((v,i)=>`<div class="tcard" data-a="pickv" data-i="${i}"><h3>${esc(v.tune||"Untitled tune")}${i===0?`<span class="pill">Default</span>`:""}</h3><p>${[v.meter,((v.lyrics||"").trim().split("\n")[0]||"")].filter(Boolean).map(esc).join(" · ")}</p>${sheets(v.sheets,v.audio,v.tune||h.title,true)}<span class="use">${i===ci?"Showing now":"Use this tune"}</span></div>`).join("")+`</article>`}
function meterScreen(){const h=HYMNS.find(x=>x.id===state.id);if(!h)return list();
const c=cur(h),k=norm(c.meter),same=x=>norm(x)===k,G={};
HYMNS.forEach(x=>versions(x).filter(v=>v.tune&&(same(v.meter)||(!v.meter&&KT[nk(v.tune)]&&same(KT[nk(v.tune)].meter)))).forEach(v=>{const g=G[nk(v.tune)]=G[nk(v.tune)]||{name:v.tune,hymns:[],sheets:[],audio:""};if(!g.hymns.includes(x))g.hymns.push(x);if(!g.sheets.length&&v.sheets?.length)g.sheets=v.sheets;if(!g.audio&&v.audio)g.audio=v.audio}));
Object.values(KT).filter(t=>same(t.meter)&&!G[nk(t.name)]).forEach(t=>{G[nk(t.name)]={name:t.name,hymns:[],sheets:[],audio:""}});
lastG=G;const own=nk(c.tune),arr=Object.entries(G).sort((a,b)=>(b[0]===own)-(a[0]===own)||a[1].name.localeCompare(b[1].name));
return `<div class="row" style="margin:0 0 14px"><button class="btn bk" data-a="open" data-id="${h.id}" aria-label="Back to hymn"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><article class="view"><h2 class="mh">Tunes for ${esc(c.meter)}</h2><p class="ms">${NAMES[k]?NAMES[k]+" · ":""}Tunes that fit the meter of “${esc(h.title)}”</p><hr>`+
(arr.length?arr.map(([key,g])=>`<div class="tcard" data-a="pick" data-key="${key}"><h3>${esc(g.name)}${key===own?`<span class="pill">This hymn’s tune</span>`:""}</h3><p>${g.hymns.length?"Used for: "+g.hymns.map(x=>esc(x.title)).join(" · "):"Standard tune for this meter"}</p>${sheets(g.sheets,g.audio,g.name,true)}<span class="use">${key===own?"Use original tune":"Use this tune"}</span></div>`).join(""):`<div class="empty">No other tunes found for this meter yet.</div>`)+(arr.length===1&&arr[0][0]===own?`<div class="empty">No other tunes for this meter yet.</div>`:"")+`</article>`}
function go(v,id=null,keep){stopA();if(!keep){alt=null;ver=null}state.v=v;state.id=id;render();window.scrollTo(0,0)}
function render(){$("header").hidden=state.v!=="list";document.documentElement.style.setProperty("--hh",(state.v==="list"?$("header").offsetHeight:0)+"px");document.body.classList.toggle("nohd",state.v!=="list");$("#app").innerHTML=state.v==="view"?view():state.v==="meter"?meterScreen():state.v==="alts"?altScreen():list();bind()}
function list(){const q=state.q.toLowerCase().trim();
const pool=HYMNS.filter(h=>(h.collection||"hymn")===cn),r=pool.filter(h=>!q||hay(h).includes(q)).sort(cmp());
return `<div class="bar"><input class="search" id="q" type="search" placeholder="${ph()}" aria-label="${ph().replace("...","")}" autocomplete="off" value="${esc(state.q)}"></div>`+
(r.length?r.map(h=>`<div class="card" data-a="open" data-id="${h.id}"><div class="num">${esc(h.number)}</div><div style="min-width:0"><h3>${esc(isPs(h)?titleCase(h.first||h.title):h.title)}</h3>${isPs(h)?(h.tune?`<p class="tn">${esc(h.tune)}</p>`:""):(h.first?`<p>${esc(h.first)}</p>`:"")}</div></div>`).join(""):`<div class="empty">${pool.length?"No hymns match your search.":EMPTY[cn]}</div>`)}
const TN=(n,hi)=>n?`<div class="tname">${esc(n)}${hi?`<button class="hnc" type="button" data-a="hinote" aria-label="High note information">${HI}</button>`:""}</div>`:"";
function tuneBlock(h){const c=cur(h);if(alt&&alt.id===h.id){const b=TN(alt.name)+(alt.sheets.length?sheets(alt.sheets,alt.audio,alt.name,true):"");return b+`<div class="tnote">Temporary tune · <button class="lk" data-a="unpick">Use original</button></div>`}return TN(c.tune,starters&&c.highNote)+(c.sheets.length?sheets(c.sheets,c.audio,c.tune||h.title,true):"")}
function view(){const h=HYMNS.find(x=>x.id===state.id);if(!h)return list();
const c=cur(h),vs=(c.lyrics||"").split(/\n\s*\n/).filter(Boolean);let n=0;
const body=vs.map(v=>/^(refrain|chorus)/i.test(v.trim())?`<div class="verse ref">${esc(v.replace(/^(refrain|chorus):?\s*/i,""))}</div>`:`<div class="verse"><span class="vn">${++n}</span><span>${esc(v)}</span></div>`).join("");
return `<div class="top2"><button class="btn bk" data-a="back" aria-label="Back to all hymns"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="sw"><input class="search" id="hq" type="search" placeholder="${ph()}" autocomplete="off" aria-label="${ph().replace("...","")}"><div class="sr" id="sr" hidden></div></div><button class="btn bk" data-a="set" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l1.9-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 1.9 1.5a7.7 7.7 0 0 0 0 3l-1.9 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button></div><div class="sp" id="sp" hidden><div class="sl">Text size</div><div class="sg"><button class="btn" data-a="fs" data-d="-.1">A−</button><button class="btn" data-a="fs" data-d=".1">A+</button></div><div class="sl">Appearance</div><div class="sg"><button class="btn${th==="auto"?" on":""}" data-a="th" data-v="auto">Auto</button><button class="btn${th==="light"?" on":""}" data-a="th" data-v="light">Light</button><button class="btn${th==="dark"?" on":""}" data-a="th" data-v="dark">Dark</button></div><div class="sl">Show High Note Indicators</div><div class="sg"><button class="btn${starters?" on":""}" data-a="starters" aria-pressed="${starters}">${starters?"On":"Off"}</button></div><div class="hint" style="margin-top:8px">Shows a high note indicator on tunes that should be started lower.</div></div>${tabsBar()}<article class="view"><div class="top"><span class="big">${esc(pageNum(h))}</span></div><h2>${esc(pageTitle(h))}</h2>${h.author?`<div class="auth">${esc(h.author)}</div>`:""}
${tuneBlock(h)}
<div class="meta">${(h.alts||[]).length?`<span class="mt" data-a="alts" data-id="${h.id}" role="button"><b>SEE ALTERNATE TUNES</b></span>`:""}</div>
<hr>${body}
${c.meter?`<hr class="fh"><div class="mfoot"><span class="mt" data-a="meter" data-id="${h.id}" role="button" title="See tunes with this meter"><b>${esc(c.meter)}</b></span></div>`:""}
</article>`}
function bind(){
const hq=$("#hq");if(hq){const sr=$("#sr");hq.oninput=()=>{const t=hq.value.toLowerCase().trim();if(!t){sr.hidden=true;return}
const r=HYMNS.filter(h=>(h.collection||"hymn")===cn&&hay(h).includes(t)).sort(cmp()).slice(0,8);
sr.innerHTML=r.length?r.map(h=>`<button data-id="${h.id}"><b>${esc(h.number)}</b><span>${esc(isPs(h)?titleCase(h.first||h.title):h.title)}</span></button>`).join(""):`<i>No hymns found.</i>`;sr.hidden=false;
sr.querySelectorAll("button").forEach(b=>b.onclick=()=>openHymn(b.dataset.id))}}
const q=$("#q");if(q)q.oninput=e=>{state.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();try{n.setSelectionRange(p,p)}catch(x){}};
document.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>{const a=el.dataset.a;
if(a==="hinote"){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent="This hymn has high notes · consider starting lower";t.classList.add("on");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("on"),3000)}else if(a==="open")openHymn(el.dataset.id);else if(a==="back"){tabs=[];go("list")}else if(a==="tab")go("view",el.dataset.id);else if(a==="starters"){starters=!starters;try{localStorage.setItem("starters",starters?"1":"0")}catch(e){}render();const sp=$("#sp");if(sp)sp.hidden=false}else if(a==="tabx"){const id=el.dataset.id,i=tabs.indexOf(id);tabs=tabs.filter(x=>x!==id);if(id===state.id){if(tabs.length)go("view",tabs[Math.max(0,i-1)]);else go("list")}else render()}
else if(a==="set"){const sp=$("#sp");sp.hidden=!sp.hidden}else if(a==="th"){th=el.dataset.v;if(th==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",th);document.querySelectorAll("[data-a=th]").forEach(b=>b.classList.toggle("on",b.dataset.v===th))}else if(a==="pick"){const h=HYMNS.find(x=>x.id===state.id),g=lastG[el.dataset.key];if(h&&g){alt=el.dataset.key===nk(cur(h).tune)?null:{id:h.id,name:g.name,sheets:g.sheets||[],audio:g.audio||""};go("view",h.id,true)}}else if(a==="unpick"){alt=null;render()}else if(a==="meter")go("meter",el.dataset.id,true);else if(a==="alts")go("alts",el.dataset.id,true);else if(a==="pickv"){ver=+el.dataset.i?{id:state.id,i:+el.dataset.i}:null;alt=null;go("view",state.id,true)}else if(a==="fs"){fs=Math.min(1.8,Math.max(.8,fs+ +el.dataset.d));document.documentElement.style.setProperty("--fs",fs)}});
document.querySelectorAll(".tw.has").forEach(w=>w.onclick=e=>{e.stopPropagation();const ov=w.querySelector(".tov");if(e.target.closest(".pb")){tog(w);return}if(ov.classList.contains("on")){if(aw===w)stopA();ov.classList.remove("on")}else ov.classList.add("on")})}
document.querySelectorAll(".st").forEach(b=>b.onclick=()=>setCol(b.dataset.c));
const fh=()=>{if(state.v==="list")document.documentElement.style.setProperty("--hh",$("header").offsetHeight+"px")};addEventListener("resize",fh);addEventListener("load",fh);try{document.fonts.ready.then(fh)}catch(e){}
render();
</script>
</body>
</html>
